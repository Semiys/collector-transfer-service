<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход администратора — Хаб Коллекционера</title>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <main class="guide-layout">
    <header class="site-header">
      <a class="site-brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span>Хаб Коллекционера<small>Перенос коллекций</small></span></a>
      <div class="site-actions">
        <button class="theme-toggle" type="button" data-theme-toggle>Тема</button>
        <a class="header-link" href="/">← На главную</a>
      </div>
      <nav class="site-nav" aria-label="Разделы сайта"><a href="/#free-transfer">Перенос коллекции</a><a href="/guide">Инструкция</a><a href="/processing">Обработка данных</a></nav>
    </header>
    <section class="panel login-panel">
      <h1>Вход администратора</h1>
      <p>Введите админ-код из настроек сервера. Он нужен только владельцу сервиса; посетителям сайта вход не требуется.</p>
      <form id="login-form">
        <label for="admin-code">Админ-код
          <input id="admin-code" type="password" autocomplete="current-password" spellcheck="false" required>
        </label>
        <button type="submit">Войти</button>
        <p id="login-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="/admin/login.js" defer></script>
</body>
</html>
