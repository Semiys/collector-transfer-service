<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хаб Коллекционера — сервис переноса коллекций</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f6fa; color: #20243a; }
    main { max-width: 46rem; margin: 1.5rem; padding: 2.5rem; border-radius: 1.5rem; background: white; box-shadow: 0 12px 40px #20243a12; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 5vw, 2.6rem); }
    p { margin: .8rem 0; line-height: 1.5; }
    .version { color: #536179; }
    .status { color: #3753a7; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Хаб Коллекционера — сервис переноса коллекций</h1>
    <p>Помогает перенести записи из таблиц, текстовых файлов и скопированных сообщений в мобильное приложение.</p>
    <p class="version">Версия 0.0.1</p>
    <p class="status">Разработка продолжается</p>
  </main>
</body>
</html>
